<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif:wght@700&family=Noto+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: per spot a 3×3 wall of small heatmaps — columns = action, rows = theory / me − theory / pool − theory. */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --fg: #1c2420; --muted: #5e6b65; --line: #d4dcd7;
  --lvl: 31, 107, 82; --pos: 196, 71, 59; --neg: 51, 90, 160; --cell-fg: #1c2420;
  --display: "Noto Serif TC", "Songti TC", serif; --body: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html[lang="zh-Hans"] { --display: "Noto Serif SC", "Songti SC", serif; --body: "Noto Sans SC", "PingFang SC", system-ui, sans-serif; }
html[lang="en"] { --display: "Noto Serif", Georgia, serif; --body: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --surface: #19211d; --fg: #e3eae6; --muted: #9aaba3; --line: #2c3833;
  --lvl: 95, 196, 157; --pos: 232, 110, 96; --neg: 110, 150, 230; --cell-fg: #e3eae6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121815; --surface: #19211d; --fg: #e3eae6; --muted: #9aaba3; --line: #2c3833;
  --lvl: 95, 196, 157; --pos: 232, 110, 96; --neg: 110, 150, 230; --cell-fg: #e3eae6; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.3; }
h1 { font-size: clamp(26px, 5vw, 34px); } h2 { font-size: 21px; } h3 { font-size: 16px; }
p { margin: 0; max-width: 76ch; }
section { display: grid; gap: 14px; min-width: 0; }
.cap { font-size: 13px; color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.wall { display: grid; grid-template-columns: 90px repeat(3, minmax(0, 1fr)); gap: 10px 14px; align-items: start; }
.wall .rh { font-size: 13px; font-weight: 700; padding-top: 26px; }
.wall .ch { font-size: 14px; font-weight: 700; text-align: center; }
@media (max-width: 820px) { .wall { grid-template-columns: 1fr; } .wall .rh { padding-top: 6px; } .wall .ch { display: none; } .mx caption { display: table-caption; } }
.mx { border-collapse: separate; border-spacing: 2px; width: 100%; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.mx caption { display: none; text-align: left; font-family: var(--body); font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.mx th { font-size: 10.5px; font-weight: 500; color: var(--muted); padding: 2px; text-align: center; }
.mx th.r { text-align: right; padding-right: 4px; }
.mx td { height: 34px; text-align: center; font-size: 12px; border-radius: 3px; color: var(--cell-fg); position: relative; }
.mx td.na { background: transparent; }
.mx td.thin { background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(127,127,127,.18) 4px 5px); }
.mx td small { display: block; font-size: 9px; color: var(--muted); line-height: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 12px; color: var(--muted); }
.ramp { display: inline-block; width: 120px; height: 10px; border-radius: 2px; vertical-align: middle; margin: 0 6px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.t th { font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--muted); }
table.t td:first-child, table.t th:first-child { text-align: left; font-family: var(--body); }
table.t tr:last-child td { border-bottom: 0; }
ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 80ch; }
/* phone captions */
@media (max-width: 820px) { .mx caption { display: table-caption; } }
.wall.w4 { grid-template-columns: 90px repeat(4, minmax(0, 1fr)); }
@media (max-width: 820px) { .wall.w4 { grid-template-columns: 1fr; } }
.part { border-top: 2px solid var(--line); padding-top: 28px; display: grid; gap: 12px; }
table.t td small { display: block; font-size: 9px; color: var(--muted); line-height: 1; }
table.t td.thin { background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(127,127,127,.18) 4px 5px); }
/* language switcher, notice, deviation summary */
.langsw { display: flex; justify-content: flex-end; gap: 4px; }
.langsw button { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 12px; cursor: pointer; }
.langsw button[aria-pressed="true"] { color: var(--fg); background: var(--surface); font-weight: 700; }
.langsw button:focus-visible { outline: 2px solid rgb(var(--lvl)); outline-offset: 2px; }
html[data-embed] .langsw { display: none; }
.notice { border: 1px solid var(--line); border-left: 4px solid rgb(var(--pos)); border-radius: 6px; background: var(--surface); padding: 10px 14px; }
.notice[hidden], .dev[hidden] { display: none; }
.dev { display: grid; gap: 14px; }
.dev .grp { display: grid; gap: 8px; }
table.t td.l { text-align: left; font-family: var(--body); }
table.t th.l { text-align: left; }
table.t tr[data-anchor] { cursor: pointer; }
table.t tr[data-anchor]:hover td { background: rgba(127, 127, 127, .08); }
.notice[hidden] + .dev[hidden] + .intro { margin-top: -30px; }
table.t td a { color: inherit; text-decoration-color: var(--muted); text-underline-offset: 3px; }
table.t td small.clamp { display: inline; margin-left: 4px; font-size: 10px; font-family: var(--body); }
/* jump target from the deviation summary */
.mx td, table.t td { scroll-margin-top: 80px; }
.mx td:target, table.t td:target { outline: 2px solid var(--fg); outline-offset: 1px; animation: flash 1.2s ease-out 2; }
@keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 40% { box-shadow: 0 0 0 6px rgba(var(--pos), .55); } }
@media (prefers-reduced-motion: reduce) { .mx td:target, table.t td:target { animation: none; } }
@media print { .langsw { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="langsw" id="langsw"></nav>
  <noscript><p>此報告需要 JavaScript 才能顯示。<br>此报告需要 JavaScript 才能显示。<br>This report needs JavaScript to display.</p></noscript>
  <header style="display:grid;gap:10px">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
  </header>
  <div class="notice" id="notice" hidden></div>
  <div class="dev" id="dev" hidden></div>
  <div class="intro" style="display:grid;gap:10px">
    <p data-i="report.intro"></p>
    <div class="legend">
      <span><span data-i="report.legend.theory"></span><span class="ramp" style="background:linear-gradient(90deg, rgba(var(--lvl),.05), rgba(var(--lvl),.85))"></span>0 → 60%+</span>
      <span><span data-i="report.legend.diff"></span><span class="ramp" style="background:linear-gradient(90deg, rgba(var(--neg),.8), rgba(var(--neg),.05), rgba(var(--pos),.05), rgba(var(--pos),.8))"></span><span data-i="report.legend.diffRange"></span></span>
      <span data-i="report.legend.thin"></span>
      <span data-i="report.legend.none"></span>
    </div>
  </div>

  <section><h2 data-i="report.sec.rfi"></h2><div class="tbl"><table class="t" id="rfi"></table></div></section>
  <section><h2 data-i="report.sec.vsOpen"></h2><div class="wall" id="w-open"></div></section>
  <section><h2 data-i="report.sec.vs3bet"></h2><div class="wall" id="w-3b"></div></section>
  <section><h2 data-i="report.sec.vs4bet"></h2><p class="cap" data-i="report.sec.vs4bet.cap"></p><div class="wall" id="w-4b"></div></section>
  <section><h2 data-i="report.sec.vs5bet"></h2><p class="cap" id="cap-5b"></p><div class="wall" id="w-5b"></div></section>
  <div class="part"><div class="eyebrow" data-i="report.part2.eyebrow"></div><h2 data-i="report.part2.title"></h2>
    <p data-i="report.part2.p1"></p>
    <ul><li data-i="report.part2.li1"></li><li data-i="report.part2.li2"></li><li data-i="report.part2.li3"></li></ul>
    <p class="cap" data-i="report.part2.cap"></p></div>
  <section><h2 data-i="report.abs.vs3bet"></h2><div class="wall w4" id="a-3b"></div></section>
  <section><h2 data-i="report.abs.vs4bet"></h2><p class="cap" data-i="report.abs.vs4bet.cap"></p><div class="wall w4" id="a-4b"></div></section>
  <section><h2 data-i="report.abs.vs5bet"></h2><p class="cap" id="acap-5b"></p><div class="wall w4" id="a-5b"></div></section>
  <p class="cap" id="footnote"></p>
</div>

<script>
const D = /*DATA*/null;
const I18N = /*I18N*/null;
const DEFAULT_LANG = /*LANG*/"zh-Hant";
const USER_TITLE = /*TITLE*/null;
const NOTICE = /*NOTICE*/null;
const POS = /*POS*/null;
const DEV = /*DEVIATIONS*/null;

const LANGS = [["zh-Hant", "繁中"], ["zh-Hans", "简中"], ["en", "English"]];
const query = new URLSearchParams(location.search);
let lang = LANGS.some(l => l[0] === query.get("lang")) ? query.get("lang") : DEFAULT_LANG;
const embed = query.get("embed") === "1";
if (embed) document.documentElement.dataset.embed = "1";
const ANCHOR = /^cell-[A-Za-z0-9_-]+$/;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function t(key, args) {
  const s = (I18N[lang] || {})[key] ?? (I18N.en || {})[key] ?? key;
  return args ? s.replace(/\{(\w+)\}/g, (m, n) => n in args ? String(args[n]) : m) : s;
}
const te = (key, args) => esc(t(key, args));
const pct = v => Math.round(v * 100);
function lvl(v) { return `background:rgba(var(--lvl),${(0.05 + Math.min(v, .6) / .6 * .8).toFixed(3)})`; }
function dif(d) { const a = Math.min(Math.abs(d), .2) / .2 * .8 + .04; return `background:rgba(var(${d >= 0 ? "--pos" : "--neg"}),${a.toFixed(3)})`; }
function val(cell, who, k) { const x = cell[who]; if (!x) return null; if (k === "f") return 1 - x.c - x.r; return x[k]; }
const OPS = () => POS.slice(0, -1), DES = () => POS.slice(1);
// vs_5bet: [some cell has theory, some cell has none]; both true = mixed layout.
const flags5 = () => { const cs = Object.values(D.vs_5bet); return [cs.some(c => c && c.th), cs.some(c => c && !c.th)]; };
const acts = (last) => [["f", t("report.act.fold")], ["c", t("report.act.call")], ["r", last]];
const whoLabel = who => t("report.who." + (who === "th" ? "theory" : who));
// Jump target of the deviation summary: the "me − theory" / "pool − theory" rows carry an id on every cell.
const cellId = (sec, op, de, who, k) => ` id="${esc(`cell-${sec}-${op}-${de}-${who}-${k}`)}"`;

function matrix(sec, who, k, title, thin, base, only) {
  const ops = OPS(), des = DES(), withId = who !== base && base === "th";
  let h = `<table class="mx"><caption>${esc(title)}</caption><tr><th></th>${des.map(d => `<th>${esc(d)}</th>`).join("")}</tr>`;
  for (const op of ops) {
    h += `<tr><th class="r">${esc(op)}</th>`;
    for (const de of des) {
      const id = withId ? cellId(sec, op, de, who, k) : "";
      const cell = D[sec][`${op}>${de}`];
      if (!cell || (only === "noTh" && cell.th)) { h += `<td${id} class="na"></td>`; continue; }
      if (!cell[base]) { h += base === "th" && (cell.me || cell.pool) ? `<td${id} class="na" title="${te("report.tip.noTheory")}">–</td>` : `<td${id} class="na"></td>`; continue; }
      const t0 = val(cell, base, k);
      if (who === base) { const nb = cell[base].n; h += `<td class="${nb !== undefined && nb < thin ? "thin" : ""}" style="${lvl(t0)}" title="${nb !== undefined ? te("report.tip.n", { n: nb }) : ""}">${pct(t0)}</td>`; continue; }
      const x = cell[who]; if (!x) { h += `<td${id} class="na"></td>`; continue; }
      const d = val(cell, who, k) - t0;
      h += `<td${id} class="${x.n < thin ? "thin" : ""}" style="${dif(d)}" title="${te("report.tip.vs", { who: whoLabel(who), a: pct(d + t0), base: whoLabel(base), b: pct(t0), n: x.n })}">${d >= 0 ? "+" : ""}${pct(d)}<small>${pct(d + t0)}</small></td>`;
    }
    h += `</tr>`;
  }
  return h + `</table>`;
}
function wall(id, sec, cols, thin, rows) {
  rows = rows || [["th", "report.row.theory", "th"], ["me", "report.row.meMinusTheory", "th"], ["pool", "report.row.poolMinusTheory", "th"]];
  let h = `<div></div>` + cols.map(a => `<div class="ch">${esc(a[1])}</div>`).join("");
  for (const [who, labKey, base, only] of rows) {
    const lab = t(labKey);
    h += `<div class="rh">${esc(lab)}</div>` + cols.map(([k, name]) => `<div>${matrix(sec, who, k, lab + "・" + name, thin, base, only)}</div>`).join("");
  }
  $(id).innerHTML = h;
}

const cellN = (x, thin) => x == null ? `<td>–</td>` : `<td class="${x.n < thin ? "thin" : ""}">${(x.r * 100).toFixed(1)}%<small>${te("report.tip.n", { n: x.n })}</small></td>`;
const gap = (x, tv, id) => x == null || tv == null ? `<td id="${id}">–</td>` : `<td id="${id}" class="${x.n < 300 ? "thin" : ""}" style="${dif(x.r - tv)}">${((x.r - tv) * 100).toFixed(1)}</td>`;
function rfi() {
  $("rfi").innerHTML = `<tr><th>${te("report.rfi.position")}</th><th>${te("report.row.theory")}</th><th>${te("report.row.me")}</th><th>${te("report.row.meMinusTheory")}</th><th>${te("report.row.pool")}</th><th>${te("report.row.poolMinusTheory")}</th></tr>` +
    OPS().map(p => { const o = D.open[p], tv = o.th && o.th.r;
      return `<tr><td>${esc(p)}</td><td>${tv == null ? "–" : (tv * 100).toFixed(1) + "%"}</td>${cellN(o.me, 300)}${gap(o.me, tv, esc(`cell-open-${p}-me`))}${cellN(o.pool, 300)}${gap(o.pool, tv, esc(`cell-open-${p}-pool`))}</tr>`; }).join("");
}

// ---------- original-space (unconditional) matrices ----------
function prior(sec, op, de, who) {
  try {
    if (sec === "vs_3bet") return D.open[op][who].r;
    if (sec === "vs_4bet") return D.vs_open[`${op}>${de}`][who].r;
    if (sec === "vs_5bet") return D.open[op][who].r * D.vs_3bet[`${op}>${de}`][who].r;
  } catch (e) { return null; }
  return null;
}
function absv(sec, op, de, who, k) {
  const x = (D[sec][`${op}>${de}`] || {})[who]; const p = prior(sec, op, de, who);
  if (!x || p == null || isNaN(p)) return null;
  return k === "reach" ? p : p * (k === "f" ? 1 - x.c - x.r : x[k]);
}
const ap = v => { const q = v * 100; return q >= 10 ? q.toFixed(0) : q >= 0.995 ? q.toFixed(1) : q.toFixed(2); };
function ratioStyle(r) { const l = Math.max(-1.5, Math.min(1.5, Math.log2(r))); const a = Math.abs(l) / 1.5 * .8 + .04;
  return `background:rgba(var(${l >= 0 ? "--pos" : "--neg"}),${a.toFixed(3)})`; }
function amatrix(sec, who, k, title, thin, base, only) {
  const ops = OPS(), des = DES();
  let mx = 0; for (const op of ops) for (const de of des) { const c = D[sec][`${op}>${de}`]; if (only === "noTh" && c && c.th) continue; const v = absv(sec, op, de, base, k); if (v != null && v > mx) mx = v; }
  let h = `<table class="mx"><caption>${esc(title)}</caption><tr><th></th>${des.map(d => `<th>${esc(d)}</th>`).join("")}</tr>`;
  for (const op of ops) {
    h += `<tr><th class="r">${esc(op)}</th>`;
    for (const de of des) {
      const cell = D[sec][`${op}>${de}`]; const tv = absv(sec, op, de, base, k);
      if (!cell || tv == null || (only === "noTh" && cell.th)) { h += `<td class="na"></td>`; continue; }
      if (who === base) { const nb = cell[base].n;
        h += `<td class="${nb !== undefined && nb < thin ? "thin" : ""}" style="background:rgba(var(--lvl),${(0.05 + (mx ? tv / mx : 0) * .8).toFixed(3)})" title="${nb !== undefined ? te("report.tip.n", { n: nb }) : ""}">${ap(tv)}</td>`; continue; }
      const v = absv(sec, op, de, who, k); if (v == null || !tv) { h += `<td class="na"></td>`; continue; }
      const r = v / tv, n = cell[who].n;
      h += `<td class="${n < thin ? "thin" : ""}" style="${ratioStyle(r)}" title="${te("report.tip.vs", { who: whoLabel(who), a: ap(v), base: whoLabel(base), b: ap(tv), n })}">×${r.toFixed(r >= 10 ? 0 : 1)}<small>${ap(v)}</small></td>`;
    }
    h += `</tr>`;
  }
  return h + `</table>`;
}
function awall(id, sec, cols, thin, rows) {
  rows = rows || [["th", "report.row.theoryPct", "th"], ["me", "report.row.meOverTheory", "th"], ["pool", "report.row.poolOverTheory", "th"]];
  cols = [["reach", t("report.act.reach")]].concat(cols);
  let h = `<div></div>` + cols.map(a => `<div class="ch">${esc(a[1])}</div>`).join("");
  for (const [who, labKey, base, only] of rows) {
    const lab = t(labKey);
    h += `<div class="rh">${esc(lab)}</div>` + cols.map(([k, name]) => `<div>${amatrix(sec, who, k, lab + "・" + name, thin, base, only)}</div>`).join("");
  }
  $(id).innerHTML = h;
}

// ---------- notice, deviation summary, texts ----------
function renderNotice() {
  const el = $("notice");
  el.hidden = !NOTICE;
  el.textContent = NOTICE ? t(NOTICE.key, NOTICE.args) : "";
}
// A value that rounds to zero shows as plain 0.0, never -0.0 or +0.0.
const signed = (v, digits) => { const s = v.toFixed(digits); return Number(s) === 0 ? Math.abs(Number(s)).toFixed(digits) : s.startsWith("-") ? s : "+" + s; };
function actionLabel(node, a) {
  if (a === "f") return t("report.act.fold");
  if (a === "c") return t("report.act.call");
  return node === "open" ? t("report.act.open") : ({ vs_open: "3bet", vs_3bet: "4bet", vs_4bet: "5bet" })[node] || a;
}
function devRow(r) {
  const spot = r.opponent ? `${r.decider} vs ${r.opponent}` : r.decider;
  const clamp = r.clamped ? `<small class="clamp" title="${te("report.dev.clampedNote")}">${te("report.dev.clamped")}</small>` : "";
  const ok = ANCHOR.test(r.anchorID);
  return `<tr${ok ? ` data-anchor="${esc(r.anchorID)}"` : ""}><td>${ok ? `<a href="#${esc(r.anchorID)}">${esc(spot)}</a>` : esc(spot)}</td><td class="l">${te("report.dev.node." + r.node)}</td><td class="l">${esc(actionLabel(r.node, r.action))}</td>` +
    `<td>${(r.obs * 100).toFixed(1)}%</td><td>${(r.theory * 100).toFixed(1)}%${clamp}</td><td>${signed(r.diffPP, 1)}</td><td>${r.n}</td><td>${signed(r.z, 1)}</td></tr>`;
}
function devGroup(title, rows) {
  if (!rows.length) return "";
  const cols = ["spot", "node", "action", "obs", "theory", "diff", "n", "z"].map(c => `<th${c === "node" || c === "action" ? ' class="l"' : ""}>${te("report.dev.col." + c)}</th>`).join("");
  return `<div class="grp"><h3>${esc(title)}</h3><div class="tbl"><table class="t"><tr>${cols}</tr>${rows.map(devRow).join("")}</table></div></div>`;
}
function renderDev() {
  const pool = (DEV && DEV.pool) || [], me = (DEV && DEV.me) || [], el = $("dev");
  el.hidden = embed || !(pool.length || me.length);
  el.innerHTML = el.hidden ? "" : `<h2>${te("report.dev.title")}</h2><p class="cap">${te("report.dev.formula")}</p>` +
    devGroup(t("report.dev.pool"), pool) + devGroup(t("report.dev.me", { hero: D.meta.hero }), me);
}
function renderTexts() {
  document.documentElement.lang = lang;
  const title = USER_TITLE ?? t("report.title.default");
  document.title = title; $("title").textContent = title;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
  const m = D.meta, span = m.date_from !== m.date_to ? t("report.span", { from: m.date_from, to: m.date_to }) : m.date_from;
  $("eyebrow").textContent = t("report.eyebrow", { size: POS.length, span });
  $("footnote").textContent = t("report.footnote", { hero: m.hero, hands: m.hands.toLocaleString("en-US"), span });
  const [anyTh, anyNoTh] = flags5(), variant = anyTh ? (anyNoTh ? "capMixed" : "capTheory") : "cap";
  $("cap-5b").textContent = t("report.sec.vs5bet." + variant);
  $("acap-5b").textContent = t("report.abs.vs5bet." + variant);
  $("langsw").setAttribute("aria-label", t("report.lang.label"));
  document.querySelectorAll("#langsw button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}
function renderAll() {
  // vs_5bet: cells with theory use the theory rows, cells without fall back to me | pool | me − pool.
  const [anyTh, anyNoTh] = flags5();
  const rows5 = (anyTh ? [["th", "report.row.theory", "th"], ["me", "report.row.meMinusTheory", "th"], ["pool", "report.row.poolMinusTheory", "th"]] : [])
    .concat(anyNoTh ? [["me", "report.row.me", "me", "noTh"], ["pool", "report.row.pool", "pool", "noTh"], ["me", "report.row.meMinusPool", "pool", "noTh"]] : []);
  const arows5 = (anyTh ? [["th", "report.row.theoryPct", "th"], ["me", "report.row.meOverTheory", "th"], ["pool", "report.row.poolOverTheory", "th"]] : [])
    .concat(anyNoTh ? [["me", "report.row.mePct", "me", "noTh"], ["pool", "report.row.poolPct", "pool", "noTh"], ["me", "report.row.meOverPool", "pool", "noTh"]] : []);
  renderTexts(); renderNotice(); renderDev(); rfi();
  wall("w-open", "vs_open", acts("3bet"), 300);
  wall("w-3b", "vs_3bet", acts("4bet"), 300);
  wall("w-4b", "vs_4bet", acts("5bet"), 100);
  wall("w-5b", "vs_5bet", acts("6bet"), 20, rows5);
  awall("a-3b", "vs_3bet", acts("4bet"), 300);
  awall("a-4b", "vs_4bet", acts("5bet"), 100);
  awall("a-5b", "vs_5bet", acts("6bet"), 20, arows5);
}
$("langsw").innerHTML = LANGS.map(([code, name]) => `<button type="button" data-lang="${code}">${name}</button>`).join("");
$("dev").addEventListener("click", e => { const row = e.target.closest("tr[data-anchor]"); if (row && ANCHOR.test(row.dataset.anchor)) location.hash = row.dataset.anchor; });
$("langsw").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { lang = b.dataset.lang; renderAll(); } });
renderAll();
</script>
</body>
</html>
